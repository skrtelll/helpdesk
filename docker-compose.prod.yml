x-airflow-prod: &airflow-prod
  networks:
    default:
    pg:

services:
  backend:
    networks:
      default:
      pg:
      edge:
        aliases:
          - helpdesk-backend
      monitoring:
        aliases:
          - helpdesk-backend

  frontend:
    networks:
      default:
      edge:
        aliases:
          - helpdesk-frontend

  airflow-init:
    <<: *airflow-prod

  airflow-apiserver:
    networks:
      default:
      pg:
      edge:
        aliases:
          - helpdesk-airflow

  airflow-scheduler:
    <<: *airflow-prod

  airflow-dag-processor:
    <<: *airflow-prod

  airflow-triggerer:
    <<: *airflow-prod

  airflow-worker:
    <<: *airflow-prod

  db-backup:
    image: ${IMAGE_REGISTRY:-ghcr.io/skrtelll}/helpdesk-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      PGHOST: ${DB_HOST:?DB_HOST is required}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-helpdesk}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      BACKUP_DATABASES: ${BACKUP_DATABASES:-helpdesk}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Minio
      RCLONE_CONFIG_S3_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/last-success -mmin -$$((BACKUP_INTERVAL_HOURS * 60 + 60)) 2>/dev/null)\""]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 10m
      start_interval: 10s
    networks:
      default:
      pg:
      s3:

networks:
  pg:
    external: true
  edge:
    external: true
  monitoring:
    external: true
  s3:
    external: true
