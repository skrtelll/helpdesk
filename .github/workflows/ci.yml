name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      notify:
        description: Слать уведомление о провале (deploy.yml шлёт своё)
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      airflow: ${{ steps.filter.outputs.airflow }}
      backup: ${{ steps.filter.outputs.backup }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            airflow:
              - 'airflow/**'
              - '.github/workflows/**'
            backup:
              - 'backup/**'
              - '.github/workflows/**'
            compose:
              - 'docker-compose*.yml'
              - 'deploy/prod.env'
              - '.env.example'
              - '.github/workflows/**'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  backend-image:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  frontend-image:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  airflow-image:
    needs: changes
    if: needs.changes.outputs.airflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: airflow
          push: false
          load: true
          tags: helpdesk-airflow:ci
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max
      - name: Check DAG imports
        run: |
          docker run --rm -i helpdesk-airflow:ci python - <<'PY'
          from airflow.models.dagbag import DagBag

          bag = DagBag("/opt/airflow/dags", include_examples=False)
          print("DAGs:", sorted(bag.dag_ids))
          for path, err in bag.import_errors.items():
              print(f"::error::{path}: {err}")
          raise SystemExit(1 if bag.import_errors else 0)
          PY

  backup-image:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck backup/backup.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

  compose-validate:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      DB_HOST: db
      DB_PASSWORD: ci
      JWT_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate local stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile airflow config -q
      - name: Validate prod stack
        run: |
          set -a; . deploy/prod.env; set +a
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile airflow config -q

  notify-failure:
    needs:
      [
        changes,
        backend-test,
        backend-image,
        frontend-image,
        airflow-image,
        backup-image,
        compose-validate,
      ]
    if: failure() && inputs.notify != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-telegram
        with:
          title: CI упал
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_TO }}
