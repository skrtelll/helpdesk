name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      notify: false
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
      checks: write

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, airflow, backup]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image="${IMAGE_REGISTRY,,}/helpdesk-${{ matrix.service }}"
          echo "tags=${image}:sha-${GITHUB_SHA::7},${image}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4

      - name: Load config
        run: |
          set -a; . deploy/prod.env; set +a
          for name in DB_HOST DB_NAME DB_USER DB_PORT ETL_DB_USER AIRFLOW_DB_HOST AIRFLOW_DB_NAME AIRFLOW_DB_USER S3_ENDPOINT BACKUP_BUCKET DEPLOY_DIR; do
            value="${!name}"
            if [ -z "$value" ] || [ "$value" = "CHANGE_ME" ]; then
              echo "::error file=deploy/prod.env::$name не задан"
              exit 1
            fi
          done
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          # ключ хоста хранится в секрете, а не берётся ssh-keyscan в момент деплоя
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Render .env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ETL_DB_PASSWORD: ${{ secrets.ETL_DB_PASSWORD }}
          AIRFLOW_DB_PASSWORD: ${{ secrets.AIRFLOW_DB_PASSWORD }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
          AIRFLOW_FERNET_KEY: ${{ secrets.AIRFLOW_FERNET_KEY }}
          AIRFLOW_SECRET_KEY: ${{ secrets.AIRFLOW_SECRET_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          umask 077
          for name in ETL_DB_PASSWORD AIRFLOW_DB_PASSWORD; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::$name должен состоять из [A-Za-z0-9_-]: он подставляется в URL и JSON"
              exit 1
            fi
          done
          {
            grep -Ev '^[[:space:]]*(#|$)' deploy/prod.env
            for name in DB_PASSWORD JWT_SECRET ETL_DB_PASSWORD \
                        AIRFLOW_DB_PASSWORD AIRFLOW_ADMIN_PASSWORD AIRFLOW_FERNET_KEY AIRFLOW_SECRET_KEY \
                        S3_ACCESS_KEY S3_SECRET_KEY; do
              value="${!name}"
              if [ -z "$value" ]; then echo "::error::$name не задан" >&2; exit 1; fi
              case "$value" in *"'"*) echo "::error::$name содержит одинарную кавычку" >&2; exit 1;; esac
              printf "%s='%s'\n" "$name" "$value"
            done
            printf "IMAGE_REGISTRY='%s'\n" "${IMAGE_REGISTRY,,}"
            # тег конкретного коммита: на сервере всегда понятно, что запущено, откат — сменой тега
            printf "IMAGE_TAG='sha-%s'\n" "${GITHUB_SHA::7}"
          } > deploy.env

      - name: Upload files
        run: |
          ssh deploy "mkdir -p '$DEPLOY_DIR'"
          scp docker-compose.yml docker-compose.prod.yml deploy:"$DEPLOY_DIR/"
          scp deploy.env deploy:"$DEPLOY_DIR/.env"
          ssh deploy "chmod 600 '$DEPLOY_DIR/.env'"

      - name: Log in to GHCR on server
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN не задан — считаем пакеты публичными"
            exit 0
          fi
          printf '%s' "$GHCR_PULL_TOKEN" | \
            ssh deploy "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

      - name: Pull and restart
        run: |
          ssh deploy "cd '$DEPLOY_DIR' && $COMPOSE pull && $COMPOSE up -d --remove-orphans --wait --wait-timeout 300"

      - name: Show status
        if: always()
        run: ssh deploy "cd '$DEPLOY_DIR' && $COMPOSE ps" || true

      - name: Prune old images
        run: ssh deploy "docker image prune -f" || true

      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh deploy.env

  notify-failure:
    needs: [ci, build-push, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-telegram
        with:
          title: Деплой в main упал
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_TO }}
