spring:
  application:
    name: helpdesk-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # Схему ведёт Flyway; Hibernate только проверяет соответствие сущностей.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    deserialization:
      # Лишние поля (status, author, assignee и т.п.) от клиента не принимаются.
      fail-on-unknown-properties: true

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  error:
    include-message: always

app:
  auth:
    # Временная заглушка до JWT (спринт 4). В проде не включаем.
    dev-header: ${APP_DEV_AUTH_HEADER:false}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-please-change}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}

logging:
  level:
    com.helpdesk.backend: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      # /health (без /actuator) — его использует Docker healthcheck
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
